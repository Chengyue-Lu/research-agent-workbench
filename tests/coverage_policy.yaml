negative_acceptance:
  - surface: m6-baseline-envelope-and-replay
    modules:
      - src/research_workbench/execution/baseline_envelope.py
      - src/research_workbench/execution/baseline.py
      - src/research_workbench/execution/baseline_closeout.py
    positive_tests:
      - test_baseline_envelope.BaselineEnvelopeTests.test_a1_a2_compile_the_same_public_bytes_with_only_the_tool_delta
      - test_baseline_execution.BaselineExecutionTests.test_a1_completes_using_only_the_public_payload
      - test_baseline_execution.BaselineExecutionTests.test_a2_uses_the_qualified_callable_then_replays_without_tools
      - test_baseline_replay_integrity.BaselineReplayIntegrityTests.test_unchanged_archive_replays
