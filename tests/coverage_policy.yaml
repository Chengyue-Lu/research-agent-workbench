      - test_integrity
      - test_kernel
      - test_method_resolutions
      - test_m2_registry_runtime
      - test_mode_action_routing_fixtures
      - test_mode_actions
      - test_model_pool
      - test_observability_model_branches
      - test_protocol_profiles
      - test_pr_governance
