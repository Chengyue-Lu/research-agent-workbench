      - src/research_workbench/validation/document_core.py
    positive_tests:
      - test_validation_critical_surfaces.CapabilityRequirementRegistryCriticalTests.test_positive_closed_registry_and_method_reference_pass
      - test_validation_critical_surfaces.DocumentCoreCriticalTests.test_byte_binding_and_repository_path_helpers_cover_all_storage_modes
    negative_tests:
