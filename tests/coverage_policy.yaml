    modules:
      - src/research_workbench/validation/document_kinds.py
      - src/research_workbench/validation/research_state_registry.py
      - src/research_workbench/research_state/closure.py
    positive_tests:
      - test_research_state_candidate.FixtureContractTest.test_two_bounded_cases_pass_schema_and_closure
      - test_research_attempt_failure.FixtureContractTest.test_bounded_lineage_cases_pass_schema_and_closure
      - test_method_trace_candidate.FixtureContractTest.test_bounded_method_trace_passes_schema_and_exact_closure
    negative_tests:
      - test_research_state_candidate.AmbiguousIdentityTest.test_duplicate_exact_ref_resolves_as_ambiguous
