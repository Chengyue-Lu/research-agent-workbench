      - test_baseline_envelope.BaselineEnvelopeTests.test_projection_is_explicitly_frozen_and_cannot_add_controls_or_replace_task
      - test_baseline_execution.BaselineExecutionTests.test_tool_file_drift_before_invocation_preserves_the_failed_attempt
      - test_baseline_execution.BaselineExecutionTests.test_rehashed_actual_binding_cannot_override_independent_trace_facts
      - test_baseline_replay_integrity.BaselineReplayIntegrityTests.test_first_request_must_match_public_payload_and_tool_surface
      - test_baseline_replay_integrity.BaselineReplayIntegrityTests.test_later_request_must_preserve_observed_tool_history
      - test_baseline_replay_integrity.BaselineReplayIntegrityTests.test_each_invocation_requires_its_own_complete_use_refs
