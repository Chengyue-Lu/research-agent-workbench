justified_exclusions:
  - path: src/research_workbench/adapters/models/session.py
    lines: [90, 91, 92, 93]
    reason: Protocol method declaration has no executable implementation body.
    owner: Chengyue-Lu
  - path: src/research_workbench/execution/host.py
    lines: [66, 67, 68, 69, 70, 71, 72, 73, 74, 76, 77, 78]
    reason: Protocol property and method declarations have no executable implementation body.
    owner: Chengyue-Lu
