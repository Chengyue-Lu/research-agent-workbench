      - test_validation_critical_surfaces.CapabilityRequirementRegistryCriticalTests.test_entry_identity_path_kind_and_hash_guards_fail_closed
      - test_validation_critical_surfaces.CapabilityRequirementRegistryCriticalTests.test_malformed_unindexed_and_relocated_requirements_cannot_bypass_closure
  - surface: method-resolution-document-closure
    modules:
      - src/research_workbench/validation/method_resolution_registry.py
    positive_tests:
      - test_method_resolutions.MethodResolutionTests.test_document_validation_closes_actions_needs_gates_and_blocks
      - test_method_resolutions.MethodResolutionTests.test_additive_gate_is_allowed
    negative_tests:
      - test_method_resolutions.MethodResolutionTests.test_wrong_task_hash_is_blocking
      - test_method_resolutions.MethodResolutionTests.test_required_action_gate_missing_or_renamed_is_blocking
      - test_method_resolutions.MethodResolutionTests.test_action_artifact_stop_block_and_claim_effects_cannot_be_weakened
      - test_method_resolutions.MethodResolutionTests.test_method_registry_missing_reference_and_shape_branches_fail_closed
  - surface: phase-b-evolution-gate-closure
    modules:
      - src/research_workbench/validation/phase_b_gate.py
    positive_tests:
      - test_phase_b_evolution_gate.PhaseBEvolutionGateTests.test_gate_is_schema_valid_and_repository_closed
    negative_tests:
      - test_phase_b_evolution_gate.PhaseBEvolutionGateTests.test_permission_data_and_side_effect_boundary_drift_are_blocking
      - test_phase_b_evolution_gate.PhaseBEvolutionGateTests.test_stable_contract_and_snapshot_hash_drift_are_blocking
      - test_phase_b_evolution_gate.PhaseBEvolutionGateTests.test_gate_reference_lineage_and_replay_adversarial_matrix
