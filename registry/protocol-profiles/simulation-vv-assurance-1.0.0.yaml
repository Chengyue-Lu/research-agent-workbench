    content_hash: sha256:6c7398983e13c81e8ecfc7a38b8101b4f9f37f2e14ce161a0f5b83343f0d71ee
  - action_ref: SIM-A2@2.0.0
    content_hash: sha256:e1d736cf098c00c4bb5856a0095eaa3da82952137c16869d22c043da4ceb8c1e
