schema_version: 0.1.0
profile_id: simulation-vv-assurance
version: 1.0.0
title: Bounded simulation verification and validation assurance
method_standard:
  family: Simulation V&V
  edition: project-selected
  profile_scope: bounded-subset
  compliance_claim: not-established
  notes:
    - This Profile separates numerical verification, model validation, and intended-use adequacy without certifying compliance with a named industry standard.
    - A project may publish a later domain-specific version that pins an applicable V&V standard and adds stricter obligations.
applicability:
  applicable_when:
    - A simulation-supported Claim depends on numerical accuracy, uncertainty treatment, or comparison with an external benchmark or observation.
    - The Task must judge whether a computational model is adequate for a declared intended use.
  not_applicable_when:
    - The Task only checks syntax, installation, visualization formatting, or execution status without a scientific adequacy Claim.
    - An accepted Run is copied unchanged and no model, input, error, uncertainty, validation, or Claim boundary is reopened.
compatible_mode_refs: [simulation@0.2.0]
scoped_actions:
