schema_version: 0.1.0
profile_id: prisma-systematic-review-reporting
version: 1.0.0
title: Bounded PRISMA-aligned systematic review reporting
method_standard:
  family: PRISMA
  edition: "2020"
  profile_scope: bounded-subset
  compliance_claim: not-established
  notes:
    - This Profile captures selected reporting and audit expectations and does not certify full PRISMA compliance.
    - Applicability is decided for a bounded Task; the Profile does not make every evidence-synthesis Task a systematic review.
applicability:
  applicable_when:
    - The Task is explicitly framed as a systematic review or a PRISMA-aligned evidence synthesis.
    - Search, selection, appraisal, synthesis, and reporting decisions must remain auditable as a bounded set.
  not_applicable_when:
    - The Task is an ad hoc source lookup, narrative note, or single-source extraction without a systematic-review claim.
    - The Task only reuses an already accepted synthesis without changing its search, selection, appraisal, or reporting basis.
compatible_mode_refs: [evidence-synthesis@0.2.0]
