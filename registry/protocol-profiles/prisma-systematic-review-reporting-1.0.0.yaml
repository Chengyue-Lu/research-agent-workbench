method_obligations:
  - obligation_id: PRISMA-SCOPE
    statement: Record the review question, eligibility boundary, registration or protocol status, and any justified departures.
    applies_to_action_refs: [ES-A1@2.0.0]
    evidence_expectation_refs: [PRISMA-PROTOCOL-EVIDENCE]
    gate_expectation_refs: [approve-systematic-review-protocol]
  - obligation_id: PRISMA-SEARCH-SELECTION
    statement: Preserve reproducible search descriptions and accountable inclusion, exclusion, duplicate-removal, and selection counts.
    applies_to_action_refs: [ES-A2@2.0.0, ES-A3@2.0.0]
    evidence_expectation_refs: [PRISMA-SEARCH-EVIDENCE, PRISMA-SELECTION-EVIDENCE]
    gate_expectation_refs: [approve-systematic-review-coverage]
  - obligation_id: PRISMA-APPRAISAL-SYNTHESIS
    statement: Make appraisal choices, synthesis population, missing results, heterogeneity, conflicts, and limitations inspectable.
    applies_to_action_refs: [ES-A5@2.0.0, ES-A6@2.0.0]
    evidence_expectation_refs: [PRISMA-APPRAISAL-EVIDENCE, PRISMA-SYNTHESIS-EVIDENCE]
    gate_expectation_refs: [approve-systematic-review-synthesis-boundary]
  - obligation_id: PRISMA-REPORT-TRACEABILITY
    statement: Link reported results and limitations to the frozen source set and preserve a review-level audit trail.
    applies_to_action_refs: [ES-A7@2.0.0, ES-A8@2.0.0]
    evidence_expectation_refs: [PRISMA-REPORT-EVIDENCE]
    gate_expectation_refs: [approve-prisma-aligned-report]
evidence_expectations:
  - expectation_id: PRISMA-PROTOCOL-EVIDENCE
    statement: Evidence identifies the frozen question, eligibility criteria, review protocol status, and protocol deviations.
    evidence_classes: [review-protocol-ref, eligibility-boundary, deviation-ledger]
  - expectation_id: PRISMA-SEARCH-EVIDENCE
    statement: Evidence records databases or sources, complete search expressions, dates, boundaries, and rerun-relevant details.
    evidence_classes: [search-strategy-record, source-boundary, search-date-ledger]
  - expectation_id: PRISMA-SELECTION-EVIDENCE
    statement: Evidence accounts for record movement and exclusion reasons without requiring one specific diagram renderer.
    evidence_classes: [selection-ledger, exclusion-reason-ledger, selection-count-summary]
  - expectation_id: PRISMA-APPRAISAL-EVIDENCE
    statement: Evidence records the chosen appraisal method and item-level judgments or reasons for non-applicability.
    evidence_classes: [appraisal-method-ref, appraisal-record]
  - expectation_id: PRISMA-SYNTHESIS-EVIDENCE
    statement: Evidence exposes synthesis inputs, missing results, conflicts, heterogeneity, assumptions, and limitations.
    evidence_classes: [synthesis-input-set, conflict-ledger, limitation-record]
  - expectation_id: PRISMA-REPORT-EVIDENCE
    statement: Evidence links review-level statements, tables, and flow counts to frozen records and decision artifacts.
    evidence_classes: [report-trace-map, source-locator-ledger, review-decision-ref]
gate_expectations:
  - gate_ref: approve-systematic-review-protocol
    effect: additive-only
    rationale: A Human decides whether the bounded protocol and eligibility boundary are acceptable for this review.
  - gate_ref: approve-systematic-review-coverage
    effect: additive-only
    rationale: A Human accepts residual search and selection coverage risk; the Profile does not infer completeness.
  - gate_ref: approve-systematic-review-synthesis-boundary
    effect: additive-only
    rationale: A Human accepts the synthesis population, exclusions, heterogeneity treatment, and declared limits.
  - gate_ref: approve-prisma-aligned-report
    effect: additive-only
    rationale: A Human accepts the bounded report as PRISMA-aligned without treating it as automatic compliance certification.
boundaries:
  defines_global_dag: false
  copies_mode_action_contract: false
  binds_skill: false
  binds_tool: false
  binds_provider: false
  binds_runtime: false
  owns_routing: false
  grants_claim_effect: false
  grants_human_decision: false
