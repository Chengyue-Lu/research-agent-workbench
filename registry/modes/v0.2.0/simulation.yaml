required_artifact_types: [method, run, evidence]
action_refs: [SIM-A1@2.0.0, SIM-A2@2.0.0, SIM-A3@2.0.0, SIM-A4@2.0.0, SIM-A5@2.0.0, SIM-A6@2.0.0, SIM-A7@2.0.0, SIM-A8@2.0.0]
claim_rules:
