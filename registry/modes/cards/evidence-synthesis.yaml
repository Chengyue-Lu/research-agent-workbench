schema_version: 0.1.0
card_id: MC-evidence-synthesis-0.1.0
mode_id: evidence-synthesis
mode_version: 0.1.0
mode_ref:
  path: registry/modes/evidence-synthesis.yaml
  sha256: 198d4445fdb80de45d9b2819bbcef9a0c14df7d3e27b23ecad282491b5fcd499
decision_basis:
  research_output_required: true
  applies_evidence_bases: [bounded-source-set, mixed-bounded-and-computational]
  does_not_apply_evidence_bases: [computational-model-output, other-empirical, none]
  ambiguous_evidence_bases: [unknown]
rules:
  triggers:
    - code: MODE-EVID-BOUNDED
      description: The Task produces Evidence or Claims from a bounded source set.
  non_triggers:
    - code: MODE-EVID-MECHANICAL
      description: A mechanical structure, hash, or locator check does not itself produce research Evidence or a Claim.
    - code: EVIDENCE-BASIS-MISMATCH
      description: Computational-run evidence without bounded source synthesis belongs to the simulation Mode.
  boundaries:
    - code: MODE-EVID-MIXED
      description: A Task spanning bounded sources and live run artifacts must preserve each evidence basis separately.
      action: combine-or-split
    - code: MODE-EVID-UNKNOWN
      description: It is unclear whether the Task reviews published claims or live computational artifacts.
      action: human-gate
combination_rules:
  - with_mode_id: simulation
    status: compatible
    default_task_action: split-if-capabilities-span-both
    constraint_merge:
      required_artifact_types: union
      human_decisions: union
      risk_rules: union
      forbidden_claims: union
      claim_support: per-mode-no-auto-upgrade
      permissions: take-stricter
      data_boundary: take-stricter
fixture_ids:
  trigger: [KMS-001, KMS-007]
  non_trigger: [KMS-002, KMS-005]
  boundary: [KMS-004, KMS-006]
  combination: [KMS-003, KMS-008]
change_gate:
  add_or_split_requires:
    - A real case exhibits a distinct Artifact, Claim, Human Gate, or risk constraint.
    - Positive, boundary, and negative fixtures demonstrate that the existing Mode combination is insufficient.
  merge_or_delete_when:
    - Representative Tasks no longer exhibit a method constraint distinct from another registered Mode.
    - The existing Mode combination expresses every observed boundary without semantic loss.
limitations:
  - This card routes only the two currently registered Modes and does not establish scientific correctness.
