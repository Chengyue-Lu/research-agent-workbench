schema_version: 0.1.0
registry_kind: provider_adapters
warning: >-
  This file contains only non-secret source references and conservative
  adapter capabilities. Keep API keys and selected model names in the named
  environment variables. Offline contract tests do not imply live API
  conformance for an account or model.
adapters:
  - adapter_id: openai-responses
    provider: openai
    enabled: false
    base_url: https://api.openai.com/v1
    credential_env: OPENAI_API_KEY
    model_env: RWB_OPENAI_MODEL
    capabilities: [text, tools, structured_output, reasoning]
    live_conformance: pending
  - adapter_id: anthropic-messages
    provider: anthropic
    enabled: false
    base_url: https://api.anthropic.com/v1
    credential_env: ANTHROPIC_API_KEY
    model_env: RWB_ANTHROPIC_MODEL
    capabilities: [text, tools, structured_output]
    live_conformance: pending
  - adapter_id: google-generate-content
    provider: google
    enabled: false
    base_url: https://generativelanguage.googleapis.com/v1beta
    credential_env: GEMINI_API_KEY
    model_env: RWB_GEMINI_MODEL
    capabilities: [text, tools, parallel_tools, structured_output]
    live_conformance: pending
  # DeepSeek's Anthropic-compatible route, reusing the anthropic-messages
  # adapter. Live conformance passed on Windows 2026-08-19 (attempt AT-API-009,
  # model deepseek-v4-flash); evidence: docs/implementation/evidence/M6-004/.
  # Known gap on this route: the endpoint emits thinking blocks by default and
  # counts them toward output tokens; the adapter skips them with a warning.
  - adapter_id: deepseek-anthropic
    provider: anthropic
    enabled: false
    base_url: https://api.deepseek.com/anthropic/v1
    credential_env: DEEPSEEK_API_KEY
    model_env: RWB_DEEPSEEK_MODEL
    capabilities: [text, tools, structured_output]
    live_conformance: passed
