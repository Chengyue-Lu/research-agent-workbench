source_row: '| M5-006 | DONE | 冻结 System-Level Evaluation Protocol | M5-003, `M5-BASELINE-TRANSPORT-ARCHITECTURE-GATE`（由
  `PHASE-D-DUAL-TRANSPORT-SYSTEM-ESTIMAND@1.0.0` 闭合） | 必须 exact-pin `docs/decisions/0020-PHASE-D-DUAL-TRANSPORT-SYSTEM-ESTIMAND.md`
  及其 Gate record 中的 SHA-256；按已接受双传输固定 A1/A2→M6、A3→M11 Core、A4→M11 Skill extension，并把
  `A4 − A2` 冻结为包含 transport difference 的 primary system-level estimand；`A2 − A1` 只作同
  transport Tool 条件增量，`A4 − A3` 仅在 pairwise exact-equality closure 证明唯一 delta 为 admitted
  Skill extension 时才作 Skill conditional increment，否则降级为 Skill-bearing package / bundled
  effect 或 unavailable，`A3 − A2` 不得称 pure Mode effect；Decision 不等于 M6-008 实现证据，不修改
  M5-003 treatment/read boundary、不给 A1/A2 注入 Mode/Method 或 dummy Snapshot，也不授予 Runtime/Method/Supply/Human
  authority；拥有并冻结覆盖 A2/A3 的 `ArmExecutionQualificationRecord@1.0.0` contract、Schema、comparison
  rule 与 fail-closed validator，要求 exact-pin Manifest/arm、Task、Requirement、frozen/runtime
  Resolution/Snapshot、相关 Mode/Action/Method、Supply/component/implementation/interface
  与 typed live evidence，且 permission/data-egress/side-effect ceiling 只能等价或收窄；M6-008
  只产生 A2 record，A3 runtime Resolution/Snapshot 仍由唯一 Capability Resolver 产生/选择，M11
  只验证并消费 exact Snapshot，M5-007 引用两端对象组装 A3 record；冻结 versioned/hash-pinned `A3A4PairwiseComparabilityRecord`，逐项比较
  shared case/Task/conditions、Mode/Action/Method、non-Skill Requirement/Supply/component、Tool/procedure、provider-visible
  interface 与相关 boundary，结果仅允许 `exact-skill-only`、`skill-bearing-package`、`not-comparable`；随后预注册
  secondary comparisons、randomization、replicates、pilot/stopping/retry、model/provider
  drift、blinding/reveal、跨 transport metric comparability、measurement status、analysis
  rule 与三层 decision hierarchy；定义独立于 M5-003 v0.1 的版本化 A4 execution-qualification overlay，exact
  引用 frozen candidate/evaluation 与准入后 Release→Projection→Supply→Resolution→Snapshot→Bundle→View→Host
  lineage，而不修改 Manifest 或产生 admission/permission authority；冻结 admission-evidence overlap
  / held-out policy，并定义独立、versioned、hash-pinned `AdmissionEvidenceOverlapAssessment`，exact-pin
  `skill_evaluation_ref`、admission case IDs、Task/input refs、typed private-oracle/checker/Human-adjudication
  identities/hashes、两侧 comparison input closure、`checked_at`、validator identity/version/hash
  与计算结果；`absent`/`unknown` 不得解释为 held-out；overlay exact 引用该 assessment，并记录 `case_selection_frozen_at`、`admission_evaluation_ref`、`overlap_status`、`overlap_refs`
  与派生的 `primary_confirmatory_eligible`；measured/estimated/unavailable/not-applicable
  严格区分，blind phase 隐藏 arm/Skill/cost/token/RWB 标签，Research Integrity 退化不得由效率抵消且禁止单一
  weighted aggregate score |'
