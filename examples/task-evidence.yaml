schema_version: 0.1.0
task_id: EVID-001
goal: Extract citable evidence for Q-001 from the bounded source set.
question_refs:
  - Q-001@1
active_modes:
  - evidence-synthesis
required_capabilities:
  - evidence-extraction
  - citation-location
required_skills:
  - literature-evidence-extraction
forbidden_skills:
  - final-synthesis
agent_profile: evidence-scout
input_refs:
  - path: examples/fixtures/paper-001.txt
    sha256: 82ea6f0d2455b97cf98786d01b8b461953e1badba4491f168a04471b39820b67
write_scope:
  - work/EVID-001/**
required_outputs:
  - evidence-record
  - handoff-transfer-manifest
  - handoff-packet
permissions:
  filesystem: worktree-write
  external_write: false
  allowed_roots: [work/EVID-001]
delegation:
  allowed: false
budget:
  max_turns: 10
  max_output_tokens: 1800
stop_conditions:
  - required_outputs_complete
  - source_boundary_exhausted
  - human_judgment_required
stale_if:
  - any_input_hash_changes
handoff_policy:
  require_transfer_manifest: true
  semantic_review: risk-triggered
  minimum_semantic_samples: 1
