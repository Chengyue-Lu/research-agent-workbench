schema_version: 0.1.0
task_id: KMS-002
goal: Audit convergence and sensitivity evidence in one bounded computational run set.
question_refs: [Q-001@1]
active_modes: [simulation]
required_capabilities: [convergence-analysis, sensitivity-analysis]
required_skills: [simulation-vv]
forbidden_skills: [experimental-validation]
agent_profile: simulation-auditor
input_refs:
  - path: examples/fixtures/run-manifest.txt
    sha256: 6079913f340dd071404c96cf0a9a041f1f59798a7cf448acf6e698e039aa0a14
write_scope: [work/KMS-002/**]
required_outputs: [simulation-vv-report, handoff-packet]
permissions:
  filesystem: worktree-write
  network: forbidden
  external_write: false
  allowed_roots: [work/KMS-002]
delegation: {allowed: false}
budget: {max_turns: 8, max_output_tokens: 1600}
atomic_boundary: One pinned run set is audited without making a physical-validation claim.
completion_checks:
  - Convergence and sensitivity sections are present and respect the Claim ceiling.
safe_pause_conditions:
  - Run inputs or a required model-assumption decision are unavailable.
stop_conditions: [required_checks_complete, input_version_changed, human_judgment_required]
stale_if: [any_input_hash_changes]
