metric_set:
- metric_id: method-violation
  definition: Count of steps that violate the frozen Method Resolution obligations.
  unit: count
  direction: lower-is-better
- metric_id: claim-overreach
  definition: Count of claims stated beyond the allowed Claim ceiling.
  unit: count
  direction: lower-is-better
- metric_id: provenance-error
  definition: Count of outputs whose provenance chain fails deterministic checks.
  unit: count
  direction: lower-is-better
- metric_id: counterevidence-omission
  definition: Count of known counter-evidence items dropped from outputs.
  unit: count
  direction: lower-is-better
- metric_id: human-correction-distance
  definition: Number of human corrections needed before an output is acceptable.
  unit: count
  direction: lower-is-better
- metric_id: omission-rate
  definition: Share of required facts the arm failed to surface (audit omission metric).
  unit: ratio
  direction: lower-is-better
- metric_id: rework-count
  definition: Number of regenerated or redone work units (audit rework metric).
  unit: count
  direction: lower-is-better
- metric_id: lookup-count
  definition: Number of re-reads of already-delivered material (audit lookup metric).
  unit: count
  direction: lower-is-better
- metric_id: h2-distortion-rate
  definition: Share of sampled compact handoffs with semantic distortion (H2 audit
    metric).
  unit: ratio
  direction: lower-is-better
- metric_id: cascade-rate
  definition: Share of errors that propagate into later work units (audit cascade
    metric).
  unit: ratio
  direction: lower-is-better
- metric_id: context-loaded
  definition: Total context characters or tokens loaded by the arm.
  unit: characters-or-tokens
  direction: lower-is-better
- metric_id: cost
  definition: Monetary cost of the arm run.
  unit: currency
  direction: lower-is-better
- metric_id: completion-time
  definition: Wall-clock completion time of the arm run.
  unit: minutes
  direction: lower-is-better
