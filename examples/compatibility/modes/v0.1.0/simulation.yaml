schema_version: 0.1.0
mode_id: simulation
version: 0.1.0
applies_when:
  - Evidence is generated by a computational model.
required_artifact_types: [method, run, evidence]
recommended_skill_capabilities: [convergence-analysis, sensitivity-analysis]
claim_rules:
  allows: [simulation_supported]
  forbids_without_other_mode: [experimentally_supported]
human_decisions: [approve_model_assumptions, accept_error_bounds]
risk_rules: [REPRO-GAP, CLAIM-OVERREACH]
