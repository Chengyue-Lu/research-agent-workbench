name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python .github/scripts/check_pr_governance.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m unittest discover -s tests -v
      - run: coverage run -m unittest discover -s tests
      - run: coverage report --fail-under=80
      - run: coverage json -o coverage.json
      - name: Enforce Trace module coverage
        run: >-
          python -c "import json; data=json.load(open('coverage.json', encoding='utf-8'));
          trace=next(item for path,item in data['files'].items()
          if path.replace(chr(92),'/').endswith('src/research_workbench/observability/trace.py'));
          value=trace['summary']['percent_covered'];
          print(f'trace coverage={value:.2f}%'); assert value >= 90"
      - run: rwb validate examples registry
      - run: python -m build --wheel
      - run: python -m venv .venv-smoke
      - run: .venv-smoke/bin/python -m pip install dist/*.whl
      - run: .venv-smoke/bin/rwb schema list
      - run: .venv-smoke/bin/rwb validate examples registry
