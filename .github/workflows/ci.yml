name: CI
run-name: Independent selection witness for PR ${{ inputs.pr }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Current PR number
        required: true
        type: number
      run_id:
        description: Candidate CI run containing the ci-plan artifact
        required: true
        type: string
      witness_sha:
        description: Independently reviewed immutable witness commit
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  selection-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      WITNESS_SHA: ${{ inputs.witness_sha }}
      PR_NUMBER: ${{ inputs.pr }}
      CONTENT_RUN: ${{ inputs.run_id }}
    steps:
      - name: Require the independently chosen workflow commit
        run: test "$GITHUB_SHA" = "$WITNESS_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -I -m pip install PyYAML==6.0.3
      - name: Read candidate Git objects and plan as data
        run: >-
          python -I .github/scripts/selection_witness.py
          --repository "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --run "$CONTENT_RUN"
          --expected-witness "$WITNESS_SHA" --output selection-witness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-selection-witness
          path: selection-witness.json
          if-no-files-found: error
