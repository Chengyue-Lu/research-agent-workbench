name: CI governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

# A metadata update cannot cancel the independently grouped content workflow.
concurrency:
  group: ci-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python .github/scripts/check_pr_governance.py
      - name: Recompute current obligations
        run: python .github/scripts/plan_ci.py --output metadata-plan.json
      - name: Metadata must retain a matching content plan
        if: contains(fromJSON('["edited", "labeled", "unlabeled"]'), github.event.action)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/ci_checks.py metadata --plan metadata-plan.json
