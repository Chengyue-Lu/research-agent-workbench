[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent-workbench"
version = "0.1.0"
description = "A human-governed, provider-neutral research agent workbench."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Research Agent Workbench contributors" }]
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
rwb = "research_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
