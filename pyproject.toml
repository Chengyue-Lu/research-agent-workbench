[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent-workbench"
version = "0.1.0"
description = "A human-governed, provider-neutral research agent workbench."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Research Agent Workbench contributors" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7",
  "rfc3339-validator>=0.1.4,<0.2",
]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "coverage>=7.6,<8",
  "hypothesis>=6.112,<7",
]

[project.scripts]
rwb = "research_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/research-agent-workbench/schemas/v0.1.0" = ["schemas/v0.1.0/*.schema.json"]

[tool.coverage.run]
source = ["research_workbench", ".github/scripts"]
branch = true

[tool.coverage.report]
show_missing = true
