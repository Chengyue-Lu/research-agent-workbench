[build-system]
requires = ["setuptools>=77"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "research-agent-workbench"
version = "0.1.0"
description = "A human-governed, provider-neutral research agent workbench."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Research Agent Workbench contributors" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7",
  "rfc3339-validator>=0.1.4,<0.2",
]

[project.optional-dependencies]
test = [
  "setuptools>=77", # Runtime resource tests import the build backend directly.
  "build>=1.2,<2",
  "coverage>=7.6,<8",
  "hypothesis>=6.112,<7",
  "markdown-it-py>=4,<5", # Public-surface checks inspect rendered Markdown links.
  "linkify-it-py>=2,<3",
]

[project.scripts]
rwb = "research_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.cmdclass]
sdist = "build_backend.RuntimeSdist"

[tool.setuptools.package-data]
research_workbench = ["_runtime_data/**/*", "_runtime_data/manifest.json", "_templates/**/*"]

[tool.coverage.run]
source = ["research_workbench", ".github/scripts"]
branch = true

[tool.coverage.report]
show_missing = true
