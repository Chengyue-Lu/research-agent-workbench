owner: Chengyue-Lu
actors:
- actor_id: root
  agent_profile: requirements, isolated implementation, real validation and publication
  required_skills: []
  inputs:
  - declared target tests
  - baseline source
  - task-local evidence
  write_scope:
  - tests/test_provider_binding_graph.py
  - tests/test_profile_conformance_binding.py
  - tests/harness_fixtures.py
  - tests/system_evaluation_fixtures.py
  output_contract: persist source identity, actual outcome, timing boundary and limitations
    before handoff
  budget: one bounded task; root serializes CPU trials
  stop_conditions:
  - no unrelated product/CI changes
  - stop and retain failed evidence
